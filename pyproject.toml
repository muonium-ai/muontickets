[project]
name = "muontickets"
dynamic = ["version"]
description = "Git-native, file-based ticketing system for agent swarms"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "^(?P<version>\\d+\\.\\d+(?:\\.\\d+)?)$"

[tool.hatch.build.targets.wheel]
packages = ["muontickets"]

[tool.uv]
package = false
