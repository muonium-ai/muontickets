[project]
name = "muontickets"
dynamic = ["version"]
description = "Git-native, file-based ticketing system for agent swarms"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
mt = "muontickets.mt:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\d+\.\d+(?:\.\d+)?)$'

[tool.hatch.build.targets.wheel]
packages = ["muontickets"]

[tool.hatch.build.targets.sdist]
include = [
  "/muontickets",
  "/mt.py",
  "/docs/README.md",
  "/LICENSE",
  "/VERSION",
  "/pyproject.toml",
]
